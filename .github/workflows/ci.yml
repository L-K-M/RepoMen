name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# Cancel superseded PR runs, but keep every push run — GitHub always cancels the
# *pending* run in a group when a newer one queues (regardless of
# cancel-in-progress), so per-ref grouping on pushes would leave burst-pushed main
# commits permanently "cancelled", masking breakage and breaking CI bisection.
# Grouping pushes per-SHA gives each commit its own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: RepoMen.xcodeproj
  SCHEME: RepoMen

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 30   # a wedged build must not burn hours of runner time
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'   # pin so a runner-image bump can't change the toolchain

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
